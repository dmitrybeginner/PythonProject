[project]
name = "pythonproject"
version = "0.1.0"
description = ""
authors = [
    {name = "dmitry",email = "dmitry_romanof@mail.ru"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.group.test.dependencies]
pytest = "^8.4.1"
